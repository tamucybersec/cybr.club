<!doctype html>
<html>
	<meta charset="utf-8" />
	<meta
		name="robots"
		content="noindex"
	/>
	<title>Content Manager</title>
	<script>
		const l = document.createElement("link");
		l.rel = "cms-config-url";
		l.type = "text/yaml";
		l.href =
			location.hostname === "localhost"
				? "/admin/config.local.yml"
				: "/admin/config.yml";
		document.head.appendChild(l);
	</script>
	<body>
		<script
			src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"
			type="module"
		></script>
	</body>
</html>
