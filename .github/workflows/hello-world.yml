name: Hello World

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hello-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t localhost:5000/hello-world:${{ github.sha }} .

      - name: Run container
        run: docker run --rm localhost:5000/hello-world:${{ github.sha }}

      - name: Push image
        run: docker push localhost:5000/hello-world:${{ github.sha }}
