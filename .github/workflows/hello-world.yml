name: Hello World

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hello:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hello-world:${{ github.sha }} .

      - name: Run container
        run: docker run --rm hello-world:${{ github.sha }}
